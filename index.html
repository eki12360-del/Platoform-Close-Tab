
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1">

  <style>
    body {
      font-family: system-ui, sans-serif;
      text-align: center;
      display: grid;
      place-items: center;
      min-height: 100vh;
      margin: 0;
      background: #f8fafc;
      color: #1e293b;
    }

    main {
      padding: 24px;
      max-width: 400px;
    }

    button {
      padding: 12px 24px;
      border: 0;
      border-radius: 8px;
      background: #2563eb;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }
  </style>
</head>

<body>
  <main>
    <p id="status">Attempting to close this tab...</p>
    <button onclick="closeTab()">Close Tab</button>
  </main>

  <script>
    function closeTab() {
      window.close();
    }

    window.addEventListener("load", () => {
      closeTab();

      setTimeout(() => {
        document.getElementById("status").textContent =
          "You may now close this tab or return to your previous page.";
      }, 800);
    });
  </script>
</body>
</html>
